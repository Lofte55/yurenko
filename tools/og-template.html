<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face{ font-family:'Manrope'; font-weight:400 800; font-display:block;
    src:url('/assets/fonts/manrope-cyrillic.woff2') format('woff2');
    unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face{ font-family:'Manrope'; font-weight:400 800; font-display:block;
    src:url('/assets/fonts/manrope-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+2122, U+2191, U+2193, U+2212; }

  *{ box-sizing:border-box; margin:0; }
  body{
    width:1200px; height:630px; overflow:hidden; position:relative;
    font-family:'Manrope', sans-serif; background:#fff; color:#111312;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:64px 72px;
  }
  .glow{
    position:absolute; right:-160px; top:-200px; width:720px; height:720px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(10,186,181,.30), rgba(10,186,181,0) 70%);
  }
  .glow2{
    position:absolute; left:-220px; bottom:-280px; width:620px; height:620px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(159,212,245,.28), rgba(159,212,245,0) 70%);
  }
  header{ display:flex; align-items:baseline; gap:14px; position:relative; }
  .mark{ font-size:30px; font-weight:800; letter-spacing:.17em; }
  .sub{ font-size:13px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:#6b7270; }

  main{ position:relative; max-width:940px; }
  .eyebrow{
    font-size:18px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
    color:#0b807c; margin-bottom:22px;
  }
  h1{
    font-size:66px; line-height:1.06; letter-spacing:-.032em; font-weight:600;
  }
  h1.small{ font-size:54px; }
  h1 em{ font-style:normal; color:#0abab5; }
  .desc{ font-size:24px; line-height:1.4; color:#3a3f3d; margin-top:24px; max-width:820px; }

  footer{ display:flex; align-items:center; gap:20px; position:relative; }
  .pill{
    background:#161a19; color:#fff; border-radius:60px; padding:14px 28px;
    font-size:20px; font-weight:700;
  }
  .pill.accent{ background:#0abab5; color:#04302f; }
  .domain{ margin-left:auto; font-size:20px; font-weight:700; color:#6b7270; letter-spacing:.02em; }

  .portrait{
    position:absolute; right:56px; bottom:0; height:520px; mix-blend-mode:multiply;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
  }
  body.has-portrait main{ max-width:660px; }
  body.has-portrait h1{ font-size:54px; }
</style>
</head>
<body class="__BODYCLASS__">
  <div class="glow"></div>
  <div class="glow2"></div>
  <header><span class="mark">YURENKO</span><span class="sub">retail design</span></header>
  <main>
    <div class="eyebrow">__EYEBROW__</div>
    <h1 class="__TITLECLASS__">__TITLE__</h1>
    __DESC__
  </main>
  <footer>
    __P1__
    __P2__
    <span class="domain">yurenko.ru</span>
  </footer>
  __PORTRAIT__


</body>
</html>
